<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>出席紀錄查詢 My Attendance</title>
<link rel="stylesheet" href="/style.css">
<style>
  body { padding: 16px; }
  .wrap { max-width: 560px; margin: 0 auto; display: grid; gap: 1rem; }
  h1 { font-size: 1.35rem; margin: 0; }
  h2 { font-size: 1.1rem; margin: 0 0 .25rem; }
  form { display: grid; gap: 1rem; }
  input { font-size: 1.05rem; padding: .7em .8em !important; }
  .err { background: var(--absent-bg); color: var(--absent); padding: .75em 1em; border-radius: var(--radius-sm); font-weight: 600; }
  .notice { background: #fff7e6; border: 1px solid #f5d9a8; color: #7a4a00; padding: .8em 1em; border-radius: var(--radius-sm); font-size: .92rem; }
  .sum { display: grid; grid-template-columns: repeat(3, 1fr); gap: .5rem; margin: .75rem 0; text-align: center; }
  .sum div { background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: .6em .5em; }
  .sum b { display: block; font-size: 1.5rem; font-variant-numeric: tabular-nums; }
  .sum span { font-size: .8rem; color: var(--muted); }
  #out { display: grid; gap: 1rem; }
  .list { display: grid; gap: .35rem; }
  .item { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: .5rem; padding: .55em .8em; border-radius: var(--radius-sm); }
  .item .when { font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }
  .item .sub { font-size: .82rem; opacity: .85; }
  .item .st { font-weight: 700; white-space: nowrap; }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>出席紀錄查詢 <span class="en">My Attendance</span></h1>
    <p class="muted" style="margin:.3rem 0 1rem">輸入學號與姓名，查看自己每次的點名結果。</p>
    <form id="f">
      <label class="field"><span>學號 <span class="en">Student ID</span></span><input name="student_no" required autocomplete="off"></label>
      <label class="field"><span>姓名 <span class="en">Name</span></span><input name="sname" required autocomplete="name"></label>
      <div class="err hidden" id="err"></div>
      <button class="btn primary big" id="go">查詢 Search</button>
    </form>
  </div>
  <div class="notice">
    <b>紀錄有誤？</b>請於<b>當天下課後立即</b>找助教說明，逾時不受理，以系統紀錄為準。<br>
    <span style="opacity:.85">If a record is wrong, talk to the TA right after class on the same day. Later requests will not be accepted.</span>
  </div>
  <div id="out"></div>
</div>
<script src="/me/app.js"></script>
</body>
</html>
